<html lang="en">
<head>

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273549;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --star: #facc15;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }
    .container { max-width: 1280px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.65rem; font-weight: 700; }
    .subtitle { color: var(--muted); font-size: 0.92rem; }
    .btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.88rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: var(--accent-hover); color: #fff; }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { background: var(--surface-2); color: var(--text); }
    .btn-green {
      background: var(--green);
      color: #0f172a;
    }
    .btn-green:hover { background: #16a34a; color: #fff; }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--green);
      color: #0f172a;
      font-weight: 600;
      padding: 12px 18px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: none;
      z-index: 100;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .panel-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 14px; color: var(--accent); }
    .sliders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .slider-group label span { color: var(--text); font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .filters-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }
    select, input[type="number"], input[type="text"], input[type="url"] {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, transform 0.15s;
    }
    .card.starred {
      border-color: rgba(250, 204, 21, 0.6);
      background: linear-gradient(180deg, rgba(250, 204, 21, 0.05) 0%, var(--surface) 100%);
    }
    .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .price { font-size: 1.4rem; font-weight: 700; color: var(--green); }
    .true-cost { font-size: 0.9rem; color: var(--amber); font-weight: 600; margin-top: 2px; }
    .card-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .icon-btn:hover { background: var(--border); color: var(--text); }
    .icon-btn.star-active {
      background: rgba(250, 204, 21, 0.15);
      border-color: rgba(250, 204, 21, 0.5);
      color: var(--star);
      font-weight: 600;
    }
    .icon-btn.remove-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
      color: var(--red);
    }
    .address { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
    .meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .badge.warn {
      background: rgba(245, 158, 11, 0.15);
      color: var(--amber);
      border-color: rgba(245, 158, 11, 0.3);
    }
    .links-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .link-pill {
      font-size: 0.8rem;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--border);
    }
    .link-pill:hover { background: var(--accent); color: #0f172a; }
    .compare-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.9rem; }
    .compare-table th, .compare-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .compare-table th { color: var(--muted); font-weight: 600; width: 180px; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 24px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
    }
    .form-grid { display: grid; gap: 12px; margin-top: 14px; }
    .form-grid input, .form-grid select { width: 100%; }
  </style>
</head>

<div class="container">

    <div>
      <h1>South Florida House-Hunting Command Center (v6)</h1>
      <div class="subtitle">Includes Your 4 Starred Favorites + All 16 Verified Live Listings • Shareable & Persistent</div>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn" onclick="openModal()">+ Add Property</button>

      <button class="btn btn-outline" onclick="exportBackup()">⬇ Export Backup</button>
      <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">⬆ Import Backup</button>
      <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importBackup(event)" />
      <button class="btn btn-outline" id="undoBtn" onclick="undoRemove()" style="display:none;">↩ Undo</button>
      <button class="btn btn-outline" onclick="resetData()">Reset</button>
    </div>
  </header>

  <!-- Global Financing Sliders -->
  <div class="panel">
    <div class="panel-title">Global Financing & Florida Cost Assumptions</div>
    <div class="sliders-grid">
      <div class="slider-group">
        <label>Down Payment <span id="dpVal">20%</span></label>
        <input type="range" id="dpSlider" min="3" max="40" step="1" value="20" oninput="render()" />
      </div>
      <div class="slider-group">
        <label>Interest Rate <span id="rateVal">6.50%</span></label>
        <input type="range" id="rateSlider" min="4.5" max="8.5" step="0.125" value="6.5" oninput="render()" />
      </div>
      <div class="slider-group">
        <label>Est. Annual Insurance <span id="insVal">$5,400/yr</span></label>
        <input type="range" id="insSlider" min="2400" max="12000" step="300" value="5400" oninput="render()" />
      </div>
      <div class="slider-group">
        <label>Est. Property Tax Rate <span id="taxVal">1.35%</span></label>
        <input type="range" id="taxSlider" min="0.8" max="2.2" step="0.05" value="1.35" oninput="render()" />
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters-bar">
    <select id="areaFilter" onchange="render()">
      <option value="ALL">All Areas (20 Verified Listings)</option>
      <option value="Boca Raton">Boca Raton</option>
      <option value="Coral Springs">Coral Springs</option>
      <option value="Miramar">Miramar</option>
      <option value="Pembroke Pines">Pembroke Pines</option>
      <option value="Davie">Davie</option>
      <option value="Coconut Creek">Coconut Creek</option>
      <option value="Deerfield Beach">Deerfield Beach</option>
      <option value="Cooper City">Cooper City</option>
      <option value="Margate">Margate</option>
    </select>
    <label style="display:flex; align-items:center; gap:6px; font-size:0.9rem; cursor:pointer; background:var(--surface); padding:8px 12px; border-radius:8px; border:1px solid var(--border);">
      <input type="checkbox" id="built1995Only" onchange="render()" /> 1995+ Built Only
    </label>
    <label style="display:flex; align-items:center; gap:6px; font-size:0.9rem; cursor:pointer; background:var(--surface); padding:8px 12px; border-radius:8px; border:1px solid var(--border);">
      <input type="checkbox" id="starredOnly" onchange="render()" /> ★ Starred Only (<span id="starCount">4</span>)
    </label>
    <label style="display:flex; align-items:center; gap:6px; font-size:0.9rem; cursor:pointer; background:var(--surface); padding:8px 12px; border-radius:8px; border:1px solid var(--border);">
      <input type="checkbox" id="cap4250" onchange="render()" /> Cap ≤ $4,250/mo
    </label>
    <select id="maxHoaFilter" onchange="render()">
      <option value="9999">Any HOA</option>
      <option value="0">No HOA ($0)</option>
      <option value="150">HOA ≤ $150/mo</option>
      <option value="250">HOA ≤ $250/mo</option>
    </select>
  </div>

  <!-- Property Cards -->
  <div class="grid" id="cardsGrid"></div>

  <!-- Comparison Panel -->
  <div class="panel" id="comparePanel" style="display:none;">
    <div class="panel-title">Side-by-Side Comparison</div>
    <div style="overflow-x:auto;">
      <table class="compare-table" id="compareTable"></table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Add Property Modal -->
<div class="modal-backdrop" id="addModal">
  <div class="modal">
    <h2 style="margin-bottom:8px;">Add New Property</h2>
    <p class="subtitle">Saved locally and included when you click "Copy Shareable Link".</p>
    <form class="form-grid" onsubmit="addProperty(event)">
      <input type="text" id="pAddress" placeholder="Street Address" required />
      <input type="text" id="pArea" placeholder="City / Area (e.g., Coral Springs)" required />
      <input type="number" id="pPrice" placeholder="List Price ($)" required />
      <input type="number" id="pYear" placeholder="Year Built (e.g., 2001)" required />
      <input type="text" id="pSpecs" placeholder="Beds / Baths / SqFt (e.g., 3 bd • 2 ba • 1,891 sqft)" required />
      <input type="number" id="pHoa" placeholder="Monthly HOA ($)" value="0" required />
      <input type="text" id="pGarage" placeholder="Garage / Parking" required />
      <input type="text" id="pOutdoor" placeholder="Yard / Pool" required />
      <input type="url" id="pZillow" placeholder="Zillow URL" />
      <input type="url" id="pRedfin" placeholder="Redfin URL (optional)" />
      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:8px;">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn">Save Property</button>
      </div>
    </form>
  </div>
</div>

const STORAGE_KEY = "sofla_verified_v6";
let properties = [];
let selectedIds = [];
let removedStack = [];

function init() {
  if (window.location.hash && window.location.hash.startsWith("#data=")) {
    try {
      const encoded = window.location.hash.slice(6);
      const decoded = JSON.parse(decodeURIComponent(escape(atob(encoded))));
      if (Array.isArray(decoded.properties)) {
        properties = decoded.properties;
        if (decoded.sliders) {
          document.getElementById("dpSlider").value = decoded.sliders.dp || 20;
          document.getElementById("rateSlider").value = decoded.sliders.rate || 6.5;
          document.getElementById("insSlider").value = decoded.sliders.ins || 5400;
          document.getElementById("taxSlider").value = decoded.sliders.tax || 1.35;
        }
        saveState();
        showToast("Loaded shared house-hunting session!");
        return;
      }
    } catch (e) {
      console.warn("Could not parse shared URL hash:", e);
    }
  }
  properties = JSON.parse(localStorage.getItem(STORAGE_KEY)) || DEFAULT_PROPERTIES.map(p => ({ ...p }));
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(properties));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 3200);
}

function copyShareLink() {
  const payload = {
    properties,
    sliders: {
      dp: document.getElementById("dpSlider").value,
      rate: document.getElementById("rateSlider").value,
      ins: document.getElementById("insSlider").value,
      tax: document.getElementById("taxSlider").value
    }
  };
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  const shareUrl = window.location.origin + window.location.pathname + "#data=" + encoded;
  navigator.clipboard.writeText(shareUrl).then(() => {
    showToast("Shareable link copied!");
  }).catch(() => {
    window.location.hash = "data=" + encoded;
    showToast("URL updated with your session state—copy the address bar!");
  });
}

function exportBackup() {
  const blob = new Blob([JSON.stringify(properties, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "house_hunt_backup.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (Array.isArray(imported)) {
        properties = imported;
        saveState();
        render();
        showToast("Backup imported successfully!");
      }
    } catch (err) {
      alert("Invalid backup JSON file.");
    }
  };
  reader.readAsText(file);
}

function calcMonthly(price, hoa) {
  const dp = parseFloat(document.getElementById("dpSlider").value) / 100;
  const rate = parseFloat(document.getElementById("rateSlider").value) / 100 / 12;
  const ins = parseFloat(document.getElementById("insSlider").value) / 12;
  const taxRate = parseFloat(document.getElementById("taxSlider").value) / 100;

  const loan = price * (1 - dp);
  const n = 360;
  const pi = rate > 0 ? (loan * rate * Math.pow(1 + rate, n)) / (Math.pow(1 + rate, n) - 1) : loan / n;
  const tax = (price * taxRate) / 12;
  return {
    pi: Math.round(pi),
    tax: Math.round(tax),
    ins: Math.round(ins),
    hoa: hoa,
    total: Math.round(pi + tax + ins + hoa)
  };
}

function toggleStar(id) {
  const prop = properties.find(p => p.id === id);
  if (prop) {
    prop.starred = !prop.starred;
    saveState();
    render();
  }
}

function removeProperty(id) {
  const idx = properties.findIndex(p => p.id === id);
  if (idx !== -1) {
    const [removed] = properties.splice(idx, 1);
    removedStack.push({ prop: removed, index: idx });
    selectedIds = selectedIds.filter(x => x !== id);
    saveState();
    render();
  }
}

function undoRemove() {
  if (removedStack.length === 0) return;
  const { prop, index } = removedStack.pop();
  properties.splice(Math.min(index, properties.length), 0, prop);
  saveState();
  render();
}

function toggleSelect(id) {
  if (selectedIds.includes(id)) {
    selectedIds = selectedIds.filter(x => x !== id);
  } else {
    selectedIds.push(id);
  }
  render();
}

function render() {
  document.getElementById("dpVal").textContent = document.getElementById("dpSlider").value + "%";
  document.getElementById("rateVal").textContent = parseFloat(document.getElementById("rateSlider").value).toFixed(2) + "%";
  document.getElementById("insVal").textContent = "$" + parseInt(document.getElementById("insSlider").value).toLocaleString() + "/yr";
  document.getElementById("taxVal").textContent = parseFloat(document.getElementById("taxSlider").value).toFixed(2) + "%";

  const starCount = properties.filter(p => p.starred).length;
  document.getElementById("starCount").textContent = starCount;
  document.getElementById("undoBtn").style.display = removedStack.length > 0 ? "inline-flex" : "none";

  const area = document.getElementById("areaFilter").value;
  const maxHoa = parseInt(document.getElementById("maxHoaFilter").value);
  const cap4250 = document.getElementById("cap4250").checked;
  const starredOnly = document.getElementById("starredOnly").checked;
  const built1995Only = document.getElementById("built1995Only").checked;

  let filtered = properties.filter(p => {
    if (built1995Only && p.year < 1995) return false;
    if (starredOnly && !p.starred) return false;
    if (area !== "ALL" && p.area !== area) return false;
    if (p.hoa > maxHoa) return false;
    if (cap4250 && calcMonthly(p.price, p.hoa).total > 4250) return false;
    return true;
  });

  filtered.sort((a, b) => (b.starred ? 1 : 0) - (a.starred ? 1 : 0));

  const grid = document.getElementById("cardsGrid");
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="panel" style="grid-column:1/-1; text-align:center; color:var(--muted);">No properties match your current filters.</div>`;
  } else {
    grid.innerHTML = filtered.map(p => {
      const m = calcMonthly(p.price, p.hoa);
      const isSel = selectedIds.includes(p.id);
      return `
        <div class="card ${p.starred ? 'starred' : ''} ${isSel ? 'selected' : ''}">
          <div>
            <div class="card-header">
              <div>
                <div class="price">$${p.price.toLocaleString()}</div>
                <div class="true-cost">Est. True Monthly: $${m.total.toLocaleString()}/mo</div>
              </div>
              <div class="card-actions">
                <button class="icon-btn ${p.starred ? 'star-active' : ''}" onclick="toggleStar(${p.id})" title="Favorite / Star">
                  ${p.starred ? '★ Starred' : '☆ Star'}
                </button>
                <button class="icon-btn remove-btn" onclick="removeProperty(${p.id})" title="Remove listing">
                  ✕
                </button>
              </div>
            </div>
            <div class="address">${p.address}</div>
            <div class="meta">${p.specs} • Built ${p.year} • HOA: $${p.hoa}/mo</div>
            <div class="badges">
              <span class="badge ${p.year < 1995 ? 'warn' : ''}">${p.year >= 1995 ? '✓' : '•'} ${p.year} ${p.year >= 1995 ? '(1995+)' : ''}</span>
              <span class="badge">✓ ${p.garage}</span>
              <span class="badge">✓ ${p.outdoor}</span>
              ${p.hoa <= 200 ? `<span class="badge">✓ Low/No HOA ($${p.hoa})</span>` : `<span class="badge warn">HOA $${p.hoa}/mo</span>`}
            </div>
            <div style="font-size:0.85rem; color:var(--muted);">${p.notes}</div>
          </div>
          <div class="links-row">
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              ${p.zillow ? `<a class="link-pill" href="${p.zillow}" target="_blank" rel="noopener">View on Zillow ↗</a>` : ''}
              ${p.redfin ? `<a class="link-pill" href="${p.redfin}" target="_blank" rel="noopener">View on Redfin ↗</a>` : ''}
            </div>
            <label style="font-size:0.85rem; cursor:pointer; display:flex; align-items:center; gap:6px; color:var(--muted);">
              <input type="checkbox" ${isSel ? 'checked' : ''} onchange="toggleSelect(${p.id})" /> Compare
            </label>
          </div>
        </div>
      `;
    }).join("");
  }

  renderCompare();
}

function renderCompare() {
  const panel = document.getElementById("comparePanel");
  const table = document.getElementById("compareTable");
  const sel = properties.filter(p => selectedIds.includes(p.id));
  if (sel.length < 2) {
    panel.style.display = "none";
    return;
  }
  panel.style.display = "block";
  const rows = [
    { label: "Address", fn: p => `${p.starred ? '★ ' : ''}<strong>${p.address}</strong>` },
    { label: "List Price", fn: p => `$${p.price.toLocaleString()}` },
    { label: "True Monthly Cost", fn: p => `<span style="color:var(--amber);font-weight:700;">$${calcMonthly(p.price, p.hoa).total.toLocaleString()}/mo</span>` },
    { label: "Year Built", fn: p => p.year },
    { label: "HOA / mo", fn: p => `$${p.hoa}/mo` },
    { label: "Garage / EV", fn: p => p.garage },
    { label: "Yard / Pool", fn: p => p.outdoor },
    { label: "Listing Links", fn: p => `${p.zillow ? `<a class="link-pill" href="${p.zillow}" target="_blank">Zillow</a>` : ''} ${p.redfin ? `<a class="link-pill" href="${p.redfin}" target="_blank">Redfin</a>` : ''}` }
  ];
  table.innerHTML = rows.map(r => `
    <tr>
      <th>${r.label}</th>
      ${sel.map(p => `<td>${r.fn(p)}</td>`).join("")}
    </tr>
  `).join("");
}

function openModal() { document.getElementById("addModal").classList.add("open"); }
function closeModal() { document.getElementById("addModal").classList.remove("open"); }

function addProperty(e) {
  e.preventDefault();
  const newProp = {
    id: Date.now(),
    address: document.getElementById("pAddress").value,
    area: document.getElementById("pArea").value,
    price: parseInt(document.getElementById("pPrice").value),
    year: parseInt(document.getElementById("pYear").value),
    specs: document.getElementById("pSpecs").value,
    hoa: parseInt(document.getElementById("pHoa").value) || 0,
    garage: document.getElementById("pGarage").value,
    outdoor: document.getElementById("pOutdoor").value,
    notes: "Added by user",
    zillow: document.getElementById("pZillow").value,
    redfin: document.getElementById("pRedfin").value,
    starred: true
  };
  properties.unshift(newProp);
  saveState();
  closeModal();
  e.target.reset();
  render();
}

function resetData() {
  localStorage.removeItem(STORAGE_KEY);
  window.location.hash = "";
  properties = DEFAULT_PROPERTIES.map(p => ({ ...p }));
  selectedIds = [];
  removedStack = [];
  render();
}

init();
render();
</script>
